<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  
  <!-- Growth arrow -->
  <path d="M 20 75 L 20 30 L 25 30 L 25 65 L 70 25 L 75 30 L 40 65 L 75 65 L 75 70 L 20 70 Z" 
        fill="url(#barGrad)" opacity="0.3"/>
  
  <!-- Bar chart -->
  <rect x="22" y="55" width="14" height="23" rx="3" fill="url(#barGrad)"/>
  <rect x="42" y="42" width="14" height="36" rx="3" fill="url(#barGrad)"/>
  <rect x="62" y="30" width="14" height="48" rx="3" fill="url(#barGrad)"/>
  
  <!-- Leaf overlay -->
  <path d="M 72 18 C 72 18 78 15 82 20 C 86 25 84 32 78 38 C 72 44 66 42 64 38 C 62 34 66 26 72 18" 
        fill="url(#leafGrad)" stroke="#15803d" stroke-width="1.5"/>
  <path d="M 68 36 Q 74 34 77 30" stroke="#15803d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>

[project]
name = "compsoc"
version = "0.1.0"
description = "AdaHack 2026 CompSoc challenge project"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
